name: Build Android Native Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup Android NDK
        run: |
          # Use sdkmanager to install NDK (most reliable method on GitHub runners)
          ANDROID_ROOT="/usr/local/lib/android/sdk"
          # Accept licenses and install NDK
          yes | ${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          ${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          NDK_PATH="${ANDROID_ROOT}/ndk/25.2.9519653"
          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> $GITHUB_ENV
          # Debug: verify toolchain exists
          ls "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android"*-clang++ 2>/dev/null || echo "WARNING: toolchain binaries not found at expected path"

      - name: Configure and Build
        run: |
          echo "ANDROID_NDK_ROOT = $ANDROID_NDK_ROOT"
          ls "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -10
          xmake f -c -p android -a arm64-v8a --ndk="$ANDROID_NDK_ROOT" -m release
          xmake

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: Personalized-Android-Mod
          path: build/android/arm64-v8a/release/libPersonalized.so
