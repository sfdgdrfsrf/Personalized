name: Build Android Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Verify output
        run: |
          echo "=== Build output ==="
          find build -name "*.so" -o -name "*.a" | head -20
          SO_FILE=$(find build -name "libPersonalized.so" | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: libPersonalized.so not found!"
            exit 1
          fi
          echo "Found: $SO_FILE"
          file "$SO_FILE"
          # Verify it's a valid ARM64 shared library
          readelf -h "$SO_FILE" 2>/dev/null | grep -E "Machine|Type" || true
          # Show exported symbols
          echo "=== Exported symbols ==="
          nm -D "$SO_FILE" 2>/dev/null | grep -E "mod_|_personalized|_pl_mod" || true
          # Show size
          ls -lh "$SO_FILE"

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Personalized-Android-Mod
          path: build/libPersonalized.so
          if-no-files-found: error
