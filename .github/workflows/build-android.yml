name: Build Android Native Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup Android NDK
        run: |
          # Download and install NDK r25c directly
          NDK_VERSION=r25c
          NDK_ZIP=android-ndk-${NDK_VERSION}-linux.zip
          wget -q https://dl.google.com/android/repository/${NDK_ZIP} -O /tmp/${NDK_ZIP}
          unzip -q /tmp/${NDK_ZIP} -d $HOME
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Configure and Build
        run: |
          echo "ANDROID_NDK_ROOT = $ANDROID_NDK_ROOT"
          xmake f -c -p android -a arm64-v8a --ndk=$ANDROID_NDK_ROOT -m release -y
          xmake -y

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: Personalized-Android-Mod
          path: build/android/arm64-v8a/release/libPersonalized.so
